# Lens definition — id "oldest", dimension "when". Mirror of newest: same date
# sort, ascending so the earliest cards lead. Rides the default browse-family
# body (no bespoke loader in lens-components.ts).
label: Oldest
icon: timeline-oldest
component: oldest
order: 1
width: 960px
config:
  sortKey: date
  sortDirection: asc
  # Mirror of newest, and that mirroring is what anchors each lens at its own
  # end: the sort puts the anchor card first, so both strips open at scrollLeft
  # 0 and read outward — Newest away from now, Oldest forward from the start.
  display: strip
  limit: 30
