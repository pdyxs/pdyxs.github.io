# Lens definition — id "newest", dimension "when". The default browse lens
# (see DEFAULT_BROWSE_LENS_ID in src/lib/lens-registry.ts).
label: Newest
icon: timeline
component: newest
order: 0
# Wider than the default column — this lens browses a dense list of cards and
# benefits from the extra breathing room on desktop. Still responsive: on
# narrow viewports the active-card-col / #card-stack min()-with-viewport logic
# shrinks it down regardless of this value.
width: 960px
config:
  sortKey: date
  sortDirection: desc
  # A timeline, not the archive: one scrolling row reading outward from now,
  # with a dot per card on the strip's track. See src/lib/strip-lens.ts.
  display: strip
  # Hard cap, and the reason the strip works at all: computeStripDots places
  # one dot per card proportionally, so at 154 cards on a ~600px track that is
  # a dot every 4px — a solid line carrying no information. Applied after
  # filtering (limitCardsForBrowse in browse-helpers.ts), so it's the 30 most
  # recent of whatever the active filters leave; anything past it is reached
  # through the strip's terminal "See all N →" tile, not by scrolling further.
  limit: 30
