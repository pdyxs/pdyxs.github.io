# Dimension-level config for the `why` panel.
#
# `why` is the one dimension with no content tree under it: no card lives at
# `why/…`, because "what this offers you" is a property of a card that lives
# somewhere else. Everything here is declaration only — the three affordances
# below are derived per-card by the generator in src/lib/why-tags.ts, and the
# two `learn/` topics are authored by hand.
#
# No `groupOrder`: the four root values are one ungrouped section, ordered by
# the explicit `order` on each declaration (Play, Look, Buy, then Learn).
#
# Deliberately no `name`/`description` — like `what/_config.yaml`, this is
# panel-only dimension config. A dimension root is not a filter value
# (fsPathToValue drops it), so an identity here would display nowhere; what it
# *would* do is make generate-card-templates.mjs treat `why/` as a card
# container and emit a Templater scaffold for creating cards in a dimension
# that holds none.
