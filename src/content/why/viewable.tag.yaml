# Authored, never derived. Put `why/viewable` in a card's `tags:` to say the
# picture is the point.
#
# It used to be derived from a header image plus a body short enough to be its
# caption — issue #96 retired that, because "does this have a picture" is a
# different question from "is this worth looking at", and the two disagreed
# across most of the Instagram-era archive. It then had a bespoke
# `viewable: always` frontmatter key, which issue #116 retired in turn: an
# authored assertion that a card belongs in a filter value is exactly what a
# tag is, and the sibling curated values (`why/learn/*`) were already written
# that way.
name: Look at something
order: 1
description: >
  Photos, prints and art where the picture is the point.
