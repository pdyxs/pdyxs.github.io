# Dimension-level config for the `what` panel.
# `groupOrder` fixes the order of the grouped sections at every drill level of
# the What panel (see groupNodesIntoSections in src/lib/browse-helpers.ts).
# Drilling into Puzzles: the three series first, then the generated difficulty
# ratings. Sections are separated by a divider only — group names are not shown.
groupOrder:
  - Series
  - Difficulty
