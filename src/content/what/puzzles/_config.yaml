renderer: card
dateLabel: Published
# A puzzle card is its grid image, and the grids are square (or taller). At the
# site's default 680px that image dominates the viewport on desktop, so puzzles
# declare a narrower card and the full-bleed image follows it down. Cascades to
# every series folder below (see FolderCascade.width in src/lib/folder-config.ts).
width: 520px
name: Puzzles
description: >
  Puzzle design and construction — logic puzzles, sudoku variants, and the craft of making something satisfyingly solvable.
# Fallback description for puzzle cards that declare none — the part drops when
# the field is absent (most puzzles have no `puzzle_type`). `difficulty` used to
# be a second part; it now rides along as a star-rating tag chip on every
# preview, and a listing shouldn't say the same thing twice.
cardDescriptionParts:
  - "{{puzzle_type}}"

# Puzzle cards are their grid image, and it is already the masthead — the
# gallery would only ever repeat it. Cascades to the series folders below.
gallery: false
# No derived `where:` tag. The travel generator would stamp each puzzle with
# wherever I happened to be on its publication date, which says nothing about a
# puzzle — they're made anywhere, over months. `none` is the generator's
# suppress sentinel (see travelWhereGenerator in src/lib/filter-generators.ts).
location: none
