<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    pdyxs.wtf favicon: the full stop, held in a square frame by five threads
    (the same rig as the suspended-dot mark). Hand-editable: keep the ids and
    classes, and the experiment page (/experiments/suspended-dot) recolours it
    to the current palette by overriding .paper / .ink / .thread / .frame.

    Threads, matching the mark:
      thread-1  dot top-left      → up to the top edge        (s top)
      thread-2  dot top-right     → up to the top edge, right (w top)
      thread-3  dot left          → the left edge             (s bottom)
      thread-4  dot bottom        → bottom-left               (x foot)
      thread-5  dot bottom-right  → bottom-right              (w foot)
  -->
  <style>
    .paper  { fill: #ffffff; }
    .ink    { fill: #000000; }
    .thread { fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: square; }
    .frame  { fill: none; stroke: #000000; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .paper  { fill: #000000; }
      .ink    { fill: #ffffff; }
      .thread { stroke: #ffffff; }
      .frame  { stroke: #ffffff; }
    }
  </style>

  <rect id="paper" class="paper" width="32" height="32"/>

  <g id="threads">
    <path id="thread-1" class="thread" d="M8.5 8.5 L8.5 0"/>
    <path id="thread-2" class="thread" d="M23.5 8.5 Q26 4 28 0"/>
    <path id="thread-3" class="thread" d="M8.5 22 L0 22"/>
    <path id="thread-4" class="thread" d="M15 23.5 Q13 30 1 30"/>
    <path id="thread-5" class="thread" d="M23.5 23.5 Q25 28 32 29"/>
  </g>

  <rect id="dot" class="ink" x="8.5" y="8.5" width="15" height="15"/>

  <rect id="frame" class="frame" x="0.75" y="0.75" width="30.5" height="30.5"/>
</svg>
