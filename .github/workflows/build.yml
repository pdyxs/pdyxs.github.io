name: Build

# CI + deploy for the Astro rebuild (issue #69, cutover #74).
#
# This repo has exactly one GitHub Pages site. Before the cutover it was
# build_type `legacy`, source `master /`, cname `pdyxs.wtf`, served by
# GitHub's built-in Jekyll builder. The `deploy` job's `configure-pages` step
# flips that source to `workflow` (GitHub Actions) as part of the SAME run
# that then deploys — so merging this is the cutover, not a step before it.
# There is still only one site: this replaces what it serves, it does not
# stand up a second one.

on:
  push:
    branches:
      # `dev` runs the gates only (generators, tests, type check) and deploys
      # nothing: the `build` job's publish steps are conditional on the target
      # being `main`, and `deploy` already is. See issue #177.
      - dev
      # `main` is the deploy branch (map #157, issue #176). It is authored by
      # nothing but promotion commits — see .github/workflows/promote.yml — so
      # a push here IS a publish. Work lands on `dev`, which deploys nothing.
      - main
  # NO SCHEDULE. The daily rebuild moved into promote.yml, which runs once at
  # 18:00 UTC and deploys only if something actually changed — main moved, or a
  # `status: scheduled` card crossed its date (scripts/pending-publish.mjs).
  # Unconditional here, it rebuilt and redeployed 685 pages every day for a
  # transition that, with zero scheduled cards, could not happen.
  workflow_dispatch:
  # Called by promote.yml after it pushes `main`. A push made with the default
  # GITHUB_TOKEN deliberately does NOT trigger workflows (GitHub's recursion
  # guard), so promotion cannot rely on its own push to fire this — it calls it
  # directly instead, which also makes promote-and-deploy one visible chain
  # rather than two runs a reader has to associate by timestamp.
  workflow_call:
    inputs:
      ref:
        description: "Ref to build. Defaults to the ref this run is on."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # What was actually built. The deploy job gates on this rather than on
      # github.ref, because neither a called run nor a scheduled one runs in
      # the context of the branch it builds.
      ref: ${{ steps.target.outputs.ref }}
    steps:
      # A called run builds `main` while executing in the caller's context, so
      # github.ref is not the answer:
      #   - called by promote.yml -> inputs.ref ('main')
      #   - push / dispatch       -> the ref itself
      - name: Resolve build target
        id: target
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            target="${{ inputs.ref }}"
          else
            target="${{ github.ref_name }}"
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"
          echo "Building $target"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}
          # Full history: the redirect generator (a prebuild step) reads the
          # retired Jekyll site from `master`. At the default depth-1 fetch of
          # the pushed ref alone, `master` is absent and the generator takes
          # its warn-and-keep path, so CI would never validate the map.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Pinned to the floor declared in package.json `engines`, so CI is the
          # thing that catches a script relying on a newer Node than we claim to
          # support. The floor is 22.18 rather than 22.12 because the generator
          # scripts in scripts/ import `.ts` modules directly, and unflagged
          # type stripping only arrived in 22.18.
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs this via `prebuild`; running it explicitly first
      # means the test and type gates see freshly generated lens registry, lens
      # icons, dither CSS and stack/tag manifests, and a generator failure is
      # reported as its own step.
      - name: Run generators (prebuild)
        run: npm run prebuild

      # The component tests render .astro components against the content
      # collection, which reads `.astro/data-store.json` AT THE PROJECT ROOT.
      # Only `astro dev` writes that file — `astro sync` and `astro build` both
      # populate node_modules/.astro/ instead, which the tests do not read. A
      # dev machine always has one lying around, so the dependency is invisible
      # until a cold checkout. Boot the dev server just long enough to write it.
      #
      # This is a workaround for a test-design problem: the component tests
      # depend on a dev-server artifact rather than building their own fixture.
      # Fixing that properly retires this step.
      - name: Warm the content store
        run: |
          npx astro dev --port 4321 > /tmp/astro-dev.log 2>&1 &
          for _ in $(seq 1 60); do
            [ -f .astro/data-store.json ] && break
            sleep 1
          done
          pkill -f "astro dev" || true
          if [ ! -f .astro/data-store.json ]; then
            echo "::error::content store was never written"
            cat /tmp/astro-dev.log
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Type check
        run: npm run check

      # `main` only, and before the build. Every card must be `inspected: true`
      # (absent counts). Failing is not shipping, so this can never unpublish a
      # live URL the way filtering would. It is a CI step and NOT part of
      # `astro build`, which also runs on build.pdyxs.wtf, the surface built to
      # review uninspected content. Covers hotfixes, hand-merges and a bug in
      # the promotion script. docs/plans/publishing-pipeline.md §6, issue #177.
      - name: Assert every card is inspected
        if: steps.target.outputs.ref == 'main'
        run: node scripts/assert-inspected.mjs

      # A `dev` run stops after the gates above: its build would be thrown away.
      - name: Build
        if: steps.target.outputs.ref == 'main'
        run: npm run build

      - name: Upload Pages artifact
        if: steps.target.outputs.ref == 'main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    # ONLY `main` is ever published. This is the guard, not the github-pages
    # environment's branch policy: a called run and a scheduled run both
    # execute in the DEFAULT branch's context (`dev`), so that policy has to
    # admit `dev` and can no longer say what is deployable. Stated here, where
    # it is a property of what was built rather than of who asked.
    if: needs.build.outputs.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Flips the Pages source from "Deploy from a branch" to "GitHub
      # Actions" the first time this runs.
      #
      # EVACUATION (not rollback; rollback is .github/workflows/rollback.yml).
      # Switching Settings -> Pages -> Source back to "Deploy from a branch" ->
      # master serves the retired Jekyll site and takes the WHOLE site back to
      # pre-cutover. Kept because it is the only lever that works when Actions
      # itself is broken. Shelf life: it works only while `master` still holds
      # a servable Jekyll site (frozen for an unrelated reason, plan §3).
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
