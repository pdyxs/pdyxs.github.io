name: Build

# Build-only CI for the Astro rebuild (issue #69).
#
# There is NO deploy job here, and there must not be one until the cutover
# ticket (#74) lands. This repo has exactly one GitHub Pages site and it is
# already live: build_type `legacy`, source `master /`, cname `pdyxs.wtf`,
# served by GitHub's built-in Jekyll builder. Adding `actions/deploy-pages`
# (or `actions/configure-pages` with `enablement`) would not stand up a second
# site — it would replace the live one. Keep this workflow to build + gates +
# artifact upload only.

on:
  push:
    branches:
      - astro-rebuild
  schedule:
    # Daily rebuild, 18:00 UTC (~4-5am Melbourne). Inert while this workflow is
    # build-only; it exists now so the shape is proven for when #74 adds the
    # deploy job and the `scheduled` card status becomes meaningful.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the redirect generator (a prebuild step) reads the
          # retired Jekyll site from `master`. At the default depth-1 fetch of
          # the pushed ref alone, `master` is absent and the generator takes
          # its warn-and-keep path, so CI would never validate the map.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pinned to the floor declared in package.json `engines`, so CI is the
          # thing that catches a script relying on a newer Node than we claim to
          # support. The floor is 22.18 rather than 22.12 because the generator
          # scripts in scripts/ import `.ts` modules directly, and unflagged
          # type stripping only arrived in 22.18.
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs this via `prebuild`; running it explicitly first
      # means the test and type gates see freshly generated lens registry, lens
      # icons, dither CSS and stack/tag manifests, and a generator failure is
      # reported as its own step.
      - name: Run generators (prebuild)
        run: npm run prebuild

      # The component tests render .astro components against the content
      # collection, which reads `.astro/data-store.json` AT THE PROJECT ROOT.
      # Only `astro dev` writes that file — `astro sync` and `astro build` both
      # populate node_modules/.astro/ instead, which the tests do not read. A
      # dev machine always has one lying around, so the dependency is invisible
      # until a cold checkout. Boot the dev server just long enough to write it.
      #
      # This is a workaround for a test-design problem: the component tests
      # depend on a dev-server artifact rather than building their own fixture.
      # Fixing that properly retires this step.
      - name: Warm the content store
        run: |
          npx astro dev --port 4321 > /tmp/astro-dev.log 2>&1 &
          for _ in $(seq 1 60); do
            [ -f .astro/data-store.json ] && break
            sleep 1
          done
          pkill -f "astro dev" || true
          if [ ! -f .astro/data-store.json ]; then
            echo "::error::content store was never written"
            cat /tmp/astro-dev.log
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
