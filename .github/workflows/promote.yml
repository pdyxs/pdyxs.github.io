name: Promote

# Moves work from `dev` to `main`, which is what GitHub Pages builds.
# See docs/plans/publishing-pipeline.md §5 (map #157, issue #175).
#
# Code and content are gated differently, through ONE primitive:
#   - content crosses per-file on `inspected: true`, daily and on demand
#   - code crosses wholesale, only when a human asks for it
#
# Deploy already lives in Actions, so promotion and deploy are one visible
# chain in the Actions tab. Deliberately NOT folded into the server's
# pdyxs-content-git-sync timer, which would couple "commit my Obsidian edits"
# to "publish the site" — two jobs with very different blast radii.

on:
  schedule:
    # 17:30 UTC, half an hour ahead of build.yml's 18:00 daily rebuild, so a
    # promotion and the rebuild that publishes a `scheduled` card crossing its
    # date land in one window rather than a day apart.
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      code:
        description: "Also promote code (wholesale). Content always crosses."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Never two promotions at once: both assert `main`'s tree from `dev`, and the
  # loser would be pushing a tree computed against a `main` that had moved.
  group: "promote"
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.promote.outputs.moved }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and both branches: the promotion diffs `main` against
          # `dev` and commits to both (content to `main`, the `awaitsCode`
          # consumption back to `dev`).
          fetch-depth: 0
          ref: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # The floor declared in package.json `engines` — scripts/*.mjs import
          # .ts modules directly, and unflagged type stripping arrived in 22.18.
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Create the local `main` branch WITHOUT checking it out. Checking it
          # out here would replace the working tree with main's — which does
          # not contain scripts/promote.mjs, because the script is exactly what
          # is being promoted. The script does its own checkout, by which point
          # Node has already loaded it and its imports into memory.
          git branch -f main origin/main

      # What is about to ship, printed BEFORE anything moves. This is the whole
      # mitigation for the one asymmetry rollback leaves open: a code revert on
      # `main` is durable, but promoting code later from a `dev` that was never
      # fixed brings the bug back silently. A code promotion is deliberate,
      # wholesale and human-triggered — this is the natural place to catch it.
      - name: What has not been promoted
        run: |
          echo "### Unpromoted commits on dev" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git log --oneline main..dev >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git log --oneline main..dev || true

      - name: Plan
        # pipefail, or `tee` supplies the exit status and a failed plan reports
        # as a green step — which is how the first cutover run got as far as
        # Promote before anything noticed.
        run: |
          set -o pipefail
          node scripts/promote.mjs --dry-run \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.code) && '--code' || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Promote
        id: promote
        run: |
          before=$(git rev-parse main)
          node scripts/promote.mjs \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.code) && '--code' || '' }}
          after=$(git rev-parse main)
          # Whether main actually moved, so a no-op daily run does not redeploy.
          if [ "$before" = "$after" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      # `dev` is pushed too, and only the awaitsCode consumption ever changes
      # it. Pushing `main` is what triggers build.yml, whose main-only
      # assertion is the last gate before deploy.
      - name: Push
        run: git push origin main dev

  # Build and deploy what was just promoted. This is a CALL rather than a
  # reliance on the push above: a push made with the default GITHUB_TOKEN does
  # not trigger workflows, so `main`'s own `on: push` never fires for a
  # promotion. Calling it also keeps promotion and deploy one chain in the
  # Actions tab, which is why promotion lives here and not on the server.
  deploy:
    needs: promote
    if: needs.promote.outputs.moved == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: main
